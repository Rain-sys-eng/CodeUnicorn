<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shared 供应商失败自动重试 · 交互稿</title>
  <style>
    :root {
      --page: #0b0d10;
      --shell: #11141a;
      --canvas: #161a21;
      --composer: #1b2028;
      --hover: rgba(255,255,255,0.06);
      --line: rgba(255,255,255,0.08);
      --line-strong: rgba(255,255,255,0.14);
      --text: #ececec;
      --quiet: #b7bdc7;
      --faint: #808792;
      --accent: #4d8dff;
      --warn: #d8b56a;
      --danger: #e39a9d;
      --ok: #86d9b0;
      --user: #2d6cdf;
      --sans: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      color: var(--text);
      font-family: var(--sans);
    }
    button, input, textarea, select { font: inherit; color: inherit; }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .caption {
      padding: 20px 24px 0;
    }
    .caption h1 {
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 620;
      letter-spacing: -0.02em;
    }
    .caption p {
      margin: 0 0 14px;
      max-width: 78ch;
      color: var(--quiet);
      font-size: 13px;
      line-height: 1.5;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      height: 24px;
      padding: 0 9px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: transparent;
      color: var(--quiet);
      font-size: 11px;
      cursor: pointer;
    }
    .chip.on, .chip:hover {
      background: var(--hover);
      color: var(--text);
    }

    .window {
      display: flex;
      flex-direction: column;
      flex: 1;
      margin: 16px 20px 20px;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: var(--canvas);
      box-shadow: 0 24px 70px rgba(0,0,0,0.35);
    }
    .titlebar {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 36px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: #1a1f27;
      color: var(--quiet);
      font-size: 12px;
    }
    .dots { display: flex; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.r { background: #ff5f57; }
    .dot.y { background: #febc2e; }
    .dot.g { background: #28c840; }
    .titlebar span { margin-left: auto; color: var(--faint); }

    .thread {
      flex: 1;
      overflow: auto;
      padding: 22px 26px 16px;
    }
    .user {
      margin: 0 0 16px auto;
      width: fit-content;
      max-width: 58%;
      padding: 9px 12px;
      border-radius: 14px 14px 4px 14px;
      background: var(--user);
      color: #fff;
      font-size: 14px;
      line-height: 1.45;
    }
    .badge {
      margin: 0 0 6px;
      color: var(--faint);
      font-size: 11px;
    }
    .fail {
      margin: 0 0 6px;
      color: #efc9ca;
      font-size: 13.5px;
      line-height: 1.5;
    }
    .retry-user {
      margin: 14px 0 8px auto;
      width: fit-content;
      max-width: 58%;
      padding: 8px 11px;
      border-radius: 14px 14px 4px 14px;
      background: color-mix(in srgb, var(--user) 68%, #11141a);
      color: #dce8ff;
      font-size: 13px;
      line-height: 1.45;
    }
    .retry-user em {
      display: block;
      margin-bottom: 2px;
      font-style: normal;
      font-size: 10px;
      letter-spacing: 0.04em;
      color: #9cb8ee;
    }
    .ok-msg {
      margin: 6px 0 14px;
      font-size: 14px;
      line-height: 1.55;
    }

    .hint-row {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 720px;
      margin: 10px 0 4px;
      min-height: 20px;
      color: var(--faint);
      font-size: 12px;
      line-height: 1.3;
    }
    .hint-row.wait { color: var(--warn); }
    .hint-row.retrying { color: #9bb8ee; }
    .hint-row.exhausted,
    .hint-row.permanent,
    .hint-row.stopped { color: var(--danger); }
    .hint-row.success { color: var(--ok); }
    .hint-row .copy {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hint-row .acts {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex: 0 0 auto;
    }
    .mini {
      height: 20px;
      padding: 0 6px;
      border: 0;
      background: transparent;
      color: inherit;
      font-size: 12px;
      cursor: pointer;
      opacity: 0.86;
    }
    .mini:hover { opacity: 1; }
    .mini + .mini::before {
      content: "·";
      margin-right: 6px;
      opacity: 0.45;
    }

    .composer {
      position: relative;
      border-top: 1px solid var(--line);
      background: var(--composer);
      padding: 10px 12px 8px;
    }
    .box {
      min-height: 64px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #12161c;
      color: var(--faint);
      font-size: 13px;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
    }
    .left-meta, .right-meta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--faint);
      font-size: 12px;
    }
    .pill {
      height: 24px;
      padding: 0 8px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--faint);
      font-size: 12px;
      cursor: pointer;
    }
    .pill:hover, .pill.on {
      background: var(--hover);
      color: var(--text);
    }
    .stop {
      width: 26px;
      height: 26px;
      border: 0;
      border-radius: 6px;
      background: #d84a4d;
      color: #fff;
      cursor: pointer;
    }

    .pop {
      position: absolute;
      right: 44px;
      bottom: 42px;
      width: 320px;
      padding: 11px 12px 12px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: #1c212b;
      box-shadow: 0 20px 48px rgba(0,0,0,0.32);
      z-index: 4;
    }
    .pop-head {
      display: flex;
      gap: 8px;
      margin: 0 0 10px;
    }
    .pop-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: rgba(77,141,255,0.16);
      color: var(--accent);
      font-size: 12px;
    }
    .pop h3 {
      margin: 0 0 3px;
      font-size: 13px;
      font-weight: 650;
    }
    .pop .sub {
      margin: 0;
      color: var(--faint);
      font-size: 11px;
      line-height: 1.4;
    }
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 10px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(20,25,34,0.72);
    }
    .switch-row strong { display: block; font-size: 12px; }
    .switch-row em { color: var(--faint); font-size: 11px; font-style: normal; }
    .switch {
      width: 32px;
      height: 18px;
      padding: 2px;
      border: 0;
      border-radius: 999px;
      background: #3a4150;
      cursor: pointer;
    }
    .switch.on { background: var(--accent); }
    .switch i {
      display: block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transform: translateX(0);
    }
    .switch.on i { transform: translateX(14px); }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .field label {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 4px;
      color: var(--quiet);
      font-size: 11px;
    }
    .field input, .field textarea, .select-btn {
      width: 100%;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #141922;
      font-size: 12px;
    }
    .select-btn {
      display: flex;
      justify-content: space-between;
      text-align: left;
    }
    .field.full { grid-column: 1 / -1; }
    .field textarea {
      min-height: 62px;
      resize: vertical;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="caption">
      <h1>幕布一行提示 · 协作旁边的小弹窗</h1>
      <p>
        失败原文下面只留一行小字和两个文字按钮。设置跟「协作」并排，按当前 Shared CLI 各自一份，只在内存生效，打开时用全局默认。
      </p>
      <div class="chips" id="chips"></div>
    </div>

    <div class="window">
      <div class="titlebar">
        <div class="dots"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i></div>
        <strong>Shared · <span id="cliLabel">Claude Code</span> · 百倍</strong>
        <span>设置只记内存</span>
      </div>
      <div class="thread" id="thread"></div>
      <div class="composer">
        <div class="pop" id="pop" hidden>
          <div class="pop-head">
            <span class="pop-mark">↻</span>
            <div>
              <h3>供应商失败自动重试</h3>
              <p class="sub" id="popSub">当前 CLI：Claude。只对这个 Shared 会话的 Claude 生效，刷新后回到默认。</p>
            </div>
          </div>
          <div class="switch-row">
            <div>
              <strong>自动再试</strong>
              <em id="switchHint">重试 3次</em>
            </div>
            <button class="switch on" id="enabledSwitch" type="button" aria-label="自动再试"><i></i></button>
          </div>
          <div class="grid">
            <div class="field">
              <label>↻ 次数</label>
              <input id="maxAttempts" type="number" min="0" max="10" />
            </div>
            <div class="field">
              <label>⟳ 退避</label>
              <select id="backoff" hidden>
                <option value="exp">指数 ×2</option>
                <option value="fixed">固定</option>
              </select>
              <button class="select-btn" id="backoffBtn" type="button">指数 ×2</button>
            </div>
            <div class="field">
              <label>⏱ 第一次等（秒）</label>
              <input id="baseDelay" type="number" min="1" max="1200" />
            </div>
            <div class="field">
              <label>⏲ 最长再等（秒）</label>
              <input id="maxDelay" type="number" min="1" max="1200" />
            </div>
            <div class="field full">
              <label>T 发给 CLI 的续跑指令</label>
              <textarea id="resumePrompt"></textarea>
            </div>
          </div>
        </div>
        <div class="box">输入消息，或 @ 引用、$ 技能、# 智能体</div>
        <div class="footer">
          <div class="left-meta">
            <span>opus-5</span>
            <span>全自动</span>
            <span>最多</span>
          </div>
          <div class="right-meta">
            <button class="pill" id="collab">协作 未开启</button>
            <button class="pill" id="retryPill">重试 3次</button>
            <button class="stop" id="hardStop">■</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DEFAULTS = {
      max: 3,
      base: 3,
      cap: 20,
      backoff: "exp",
      prompt: "继续。上一轮因供应商暂时失败中断，请从已完成进度接着做，不要重复已完成的步骤。",
    };
    const CLIS = [
      { id: "claude", label: "Claude Code" },
      { id: "codex", label: "Codex" },
      { id: "kimi", label: "Kimi" },
    ];
    const scenarios = [
      { id: "pool403", label: "号池 403", retryable: true, reason: "号池", detail: "Failed to authenticate. API Error: 403 API Key is not assigned to any group and cannot be used." },
      { id: "timeout", label: "请求超时", retryable: true, reason: "超时", detail: "请求在收到响应前已超时。可能是网络抖动或上游服务繁忙导致，请稍后重试。" },
      { id: "rate", label: "429 过多", retryable: true, reason: "请求过多", detail: "API Error: 429 Too Many Requests" },
      { id: "busy", label: "过载", retryable: true, reason: "过载", detail: "upstream overloaded, please retry later" },
      { id: "missingModel", label: "模型不存在", retryable: false, reason: "配置错误", detail: "unknown model 'claude-opus-5'" },
      { id: "stop", label: "用户停止", retryable: false, reason: "已停止", detail: "Turn cancelled: Session stopped." },
    ];

    const memory = Object.fromEntries(CLIS.map((cli) => [cli.id, { ...DEFAULTS }]));
    const state = {
      cli: "claude",
      scenario: scenarios[0],
      phase: "idle",
      attempt: 0,
      seconds: 0,
      timer: null,
      events: [],
      popOpen: false,
    };

    const $ = (id) => document.getElementById(id);
    const cfg = () => memory[state.cli];
    function clamp(n, min, max) {
      if (!Number.isFinite(n)) return min;
      return Math.min(max, Math.max(min, Math.trunc(n)));
    }
    function delayFor(attempt) {
      const s = cfg();
      if (s.backoff === "fixed") return Math.min(s.base, s.cap);
      return Math.min(s.base * (2 ** Math.max(0, attempt - 1)), s.cap);
    }
    function stopTimer() {
      if (state.timer) {
        clearInterval(state.timer);
        state.timer = null;
      }
    }
    function promptText() {
      return cfg().prompt.trim() || "继续";
    }
    function cliName() {
      return CLIS.find((item) => item.id === state.cli)?.label ?? "Claude Code";
    }
    function hintCopy() {
      const s = cfg();
      if (state.phase === "wait") {
        return `${cliName()} 暂时失败（${state.scenario.reason}）· ${state.seconds}s 后再试 ${state.attempt}/${s.max}`;
      }
      if (state.phase === "retrying") return `正在发给 ${cliName()} · ${state.attempt}/${s.max}`;
      if (state.phase === "exhausted") return `${cliName()} 已重试 ${s.max} 次仍失败`;
      if (state.phase === "permanent") return `${state.scenario.reason}，不自动再发`;
      if (state.phase === "stopped") return "已停止后续自动重试";
      if (state.phase === "success") return `第 ${state.attempt} 次已接通`;
      return "";
    }
    function hintActions() {
      if (state.phase === "wait") {
        return `<button class="mini" data-act="now">立即</button><button class="mini" data-act="stop">停止</button>`;
      }
      if (state.phase === "retrying") {
        return `<button class="mini" data-act="stop">停止</button>`;
      }
      if (["exhausted", "permanent", "stopped"].includes(state.phase)) {
        return `<button class="mini" data-act="manual">再试</button>`;
      }
      return "";
    }

    function syncForm() {
      const s = cfg();
      $("maxAttempts").value = s.max;
      $("baseDelay").value = s.base;
      $("maxDelay").value = s.cap;
      $("backoff").value = s.backoff;
      $("resumePrompt").value = s.prompt;
      $("backoffBtn").textContent = s.backoff === "fixed" ? "固定" : "指数 ×2";
      $("enabledSwitch").classList.toggle("on", s.enabled !== false);
      $("switchHint").textContent = s.enabled === false || s.max <= 0 ? "重试 关" : `重试 ${s.max}次`;
      $("retryPill").textContent = s.enabled === false || s.max <= 0 ? "重试 关" : `重试 ${s.max}次`;
      $("retryPill").classList.toggle("on", state.popOpen);
      $("pop").hidden = !state.popOpen;
      $("popSub").textContent = `当前 CLI：${cliName()}。只对这个 Shared 会话的 ${cliName()} 生效，刷新后回到默认。`;
      $("cliLabel").textContent = cliName();
    }

    function render() {
      syncForm();
      $("chips").innerHTML = scenarios.map((item) => (
        `<button class="chip${item.id === state.scenario.id ? " on" : ""}" data-id="${item.id}">${item.label}</button>`
      )).join("");

      const blocks = state.events.map((item) => {
        if (item.type === "fail") {
          return `<div class="fail"><div class="badge">${cliName()} · 百倍 · max</div>${item.text}</div>`;
        }
        if (item.type === "prompt") {
          return `<div class="retry-user"><em>自动续跑</em>${item.text}</div>`;
        }
        if (item.type === "ok") {
          return `<div class="ok-msg">${item.text}</div>`;
        }
        return "";
      }).join("");

      const hint = hintCopy() ? `
        <div class="hint-row ${state.phase}">
          <span class="copy">${hintCopy()}</span>
          <span class="acts">${hintActions()}</span>
        </div>` : "";

      $("thread").innerHTML = `
        <div class="user">继续分析 app.js 里的 fmt 实现，并补测试。</div>
        ${blocks}
        ${hint}
      `;
      $("thread").scrollTop = $("thread").scrollHeight;
    }

    function startWait() {
      const s = cfg();
      if (!state.scenario.retryable) {
        state.phase = state.scenario.id === "stop" ? "stopped" : "permanent";
        state.events.push({ type: "fail", text: state.scenario.detail });
        render();
        return;
      }
      if (s.max <= 0 || state.attempt >= s.max) {
        state.phase = "exhausted";
        state.events.push({ type: "fail", text: state.scenario.detail });
        render();
        return;
      }
      state.attempt += 1;
      state.seconds = delayFor(state.attempt);
      state.phase = "wait";
      state.events.push({ type: "fail", text: state.scenario.detail });
      render();
      stopTimer();
      state.timer = setInterval(() => {
        state.seconds -= 1;
        if (state.seconds <= 0) {
          fireRetry();
          return;
        }
        render();
      }, 1000);
    }

    function fireRetry() {
      stopTimer();
      state.phase = "retrying";
      state.events.push({ type: "prompt", text: promptText() });
      render();
      setTimeout(() => {
        const recovered = state.scenario.retryable && state.attempt >= Math.min(3, cfg().max);
        if (recovered) {
          state.phase = "success";
          state.events.push({ type: "ok", text: "已读 app.js 第 126-145 行，继续补 fmt 测试。" });
          render();
          return;
        }
        startWait();
      }, 700);
    }

    function stopRetry() {
      stopTimer();
      state.phase = "stopped";
      render();
    }

    function startScenario(scenario) {
      stopTimer();
      state.scenario = scenario;
      state.attempt = 0;
      state.events = [];
      startWait();
    }

    $("chips").addEventListener("click", (event) => {
      const id = event.target.dataset.id;
      const next = scenarios.find((item) => item.id === id);
      if (next) startScenario(next);
    });
    $("thread").addEventListener("click", (event) => {
      const act = event.target.dataset.act;
      if (act === "now") fireRetry();
      if (act === "stop") stopRetry();
      if (act === "manual") startScenario(state.scenario);
    });
    $("retryPill").addEventListener("click", () => {
      state.popOpen = !state.popOpen;
      render();
    });
    function writeCfg() {
      memory[state.cli] = {
        enabled: $("enabledSwitch").classList.contains("on"),
        max: clamp(Number($("maxAttempts").value), 0, 10),
        base: clamp(Number($("baseDelay").value), 1, 1200),
        cap: clamp(Number($("maxDelay").value), 1, 1200),
        backoff: $("backoff").value,
        prompt: $("resumePrompt").value,
      };
      render();
    }
    ["maxAttempts", "baseDelay", "maxDelay", "resumePrompt"]
      .forEach((id) => $(id).addEventListener("input", writeCfg));
    $("enabledSwitch").addEventListener("click", () => {
      $("enabledSwitch").classList.toggle("on");
      writeCfg();
    });
    $("backoffBtn").addEventListener("click", () => {
      $("backoff").value = $("backoff").value === "fixed" ? "exp" : "fixed";
      writeCfg();
    });
    $("hardStop").addEventListener("click", stopRetry);
    document.addEventListener("mousedown", (event) => {
      if (!state.popOpen) return;
      if ($("pop").contains(event.target) || $("retryPill").contains(event.target)) return;
      state.popOpen = false;
      render();
    });

    startScenario(scenarios[0]);
  </script>
</body>
</html>
