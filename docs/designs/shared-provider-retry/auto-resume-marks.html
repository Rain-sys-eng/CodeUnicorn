<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>自动续跑标记 · 10 种选款</title>
  <style>
    :root {
      --page: #ececec;
      --canvas: #f4f4f5;
      --ink: #141416;
      --mute: #5c5c62;
      --bubble: #2b313c;
      --bubble-text: #f4f5f7;
      --line: rgba(20, 20, 22, 0.12);
      --sans: "SF Pro Text", -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: var(--sans);
    }
    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 24px 64px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    .lead {
      margin: 0 0 22px;
      max-width: 72ch;
      color: var(--mute);
      font-size: 13px;
      line-height: 1.55;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      padding: 14px 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }
    .card.picked {
      outline: 2px solid var(--ink);
    }
    .meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .meta strong {
      font-size: 13px;
      font-weight: 650;
    }
    .meta span {
      color: var(--mute);
      font-size: 11px;
    }
    .canvas {
      padding: 18px 16px 20px;
      border-radius: 10px;
      background: var(--canvas);
    }
    .row {
      display: flex;
      justify-content: flex-end;
    }
    .bubble {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 12px;
      background: var(--bubble);
      color: var(--bubble-text);
      font-size: 13px;
      line-height: 1.45;
    }
    .copy {
      margin-top: 14px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 650;
    }
    button.pick {
      margin-top: 10px;
      height: 28px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    button.pick:hover { background: #f7f7f7; }

    /* 1 角标叠在气泡上 */
    .v1 { position: relative; }
    .v1 .bubble { padding-top: 16px; }
    .v1 .mark {
      position: absolute;
      top: -7px;
      right: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #111;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    /* 2 气泡内前置字 */
    .v2 .bubble { display: flex; flex-direction: column; gap: 6px; }
    .v2 .mark {
      align-self: flex-start;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
    }

    /* 3 气泡下右对齐细字 */
    .v3 { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .v3 .mark {
      font-size: 11px;
      font-weight: 650;
      color: var(--ink);
    }

    /* 4 黑底胶囊贴气泡顶 */
    .v4 { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .v4 .mark {
      height: 18px;
      padding: 0 8px;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      line-height: 18px;
    }

    /* 5 线框方标 */
    .v5 { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .v5 .mark {
      height: 18px;
      padding: 0 6px;
      border: 1px solid var(--ink);
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      line-height: 16px;
      letter-spacing: 0.06em;
    }

    /* 6 圆点 + 字 */
    .v6 { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .v6 .mark {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 650;
    }
    .v6 .mark i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #111;
    }

    /* 7 斜角书签 */
    .v7 { position: relative; padding-top: 2px; }
    .v7 .mark {
      position: absolute;
      top: 0;
      right: 0;
      padding: 3px 9px 4px;
      background: #111;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 8px 100%, 0 70%);
    }
    .v7 .bubble { border-top-right-radius: 0; padding-top: 18px; }

    /* 8 左侧竖线轨 */
    .v8 {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 8px;
    }
    .v8 .mark {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--ink);
      padding-top: 2px;
    }

    /* 9 等宽编号 */
    .v9 { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .v9 .mark {
      font-family: "SF Mono", ui-monospace, Menlo, monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--ink);
    }

    /* 10 气泡底部分割条 */
    .v10 .bubble { padding-bottom: 8px; }
    .v10 .mark {
      display: block;
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px solid rgba(255,255,255,0.18);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.7);
    }

    .chosen {
      position: sticky;
      bottom: 16px;
      margin-top: 18px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.92);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>自动续跑标记 · 10 种</h1>
    <p class="lead">
      都只用黑白灰，适配深浅色。点卡片选一种，告诉我编号即可落地。
      底部幕布提示已改成正文黑、加粗，不在这页里比。
    </p>
    <div class="grid" id="grid"></div>
    <div class="chosen" id="chosen">还没选。点卡片或「选这个」。</div>
  </div>
  <script>
    const variants = [
      { id: 1, name: "角标压边", kind: "叠在气泡右上角", cls: "v1", mark: "自动续跑", inBubble: false },
      { id: 2, name: "气泡内前置", kind: "当气泡自己的小标题", cls: "v2", mark: "自动续跑", inBubble: true, prefix: true },
      { id: 3, name: "右下细字", kind: "不要容器，当元信息", cls: "v3", mark: "自动续跑", inBubble: false },
      { id: 4, name: "黑胶囊", kind: "实心底，对比最强", cls: "v4", mark: "自动续跑", inBubble: false },
      { id: 5, name: "线框方标", kind: "更硬，不像 pill", cls: "v5", mark: "自动续跑", inBubble: false },
      { id: 6, name: "圆点标注", kind: "最小干预", cls: "v6", mark: "自动续跑", inBubble: false, dot: true },
      { id: 7, name: "斜角书签", kind: "贴在气泡右上切口", cls: "v7", mark: "自动续跑", inBubble: false },
      { id: 8, name: "竖排侧标", kind: "气泡左侧一条字", cls: "v8", mark: "自动续跑", inBubble: false, side: true },
      { id: 9, name: "等宽编号", kind: "系统日志感", cls: "v9", mark: "AUTO · 续跑", inBubble: false },
      { id: 10, name: "气泡内底栏", kind: "跟正文同一块", cls: "v10", mark: "自动续跑", inBubble: true, footer: true },
    ];
    const text = "继续。上一轮因供应商暂时失败中断，请从已完成进度接着做，不要重复已完成的步骤。";
    const grid = document.getElementById("grid");
    const chosen = document.getElementById("chosen");
    let current = null;

    function markHtml(item) {
      if (item.dot) return `<span class="mark"><i></i>${item.mark}</span>`;
      return `<span class="mark">${item.mark}</span>`;
    }
    function mock(item) {
      if (item.prefix) {
        return `<div class="row ${item.cls}"><div class="bubble">${markHtml(item)}${text}</div></div>`;
      }
      if (item.footer) {
        return `<div class="row ${item.cls}"><div class="bubble">${text}${markHtml(item)}</div></div>`;
      }
      if (item.side) {
        return `<div class="row ${item.cls}">${markHtml(item)}<div class="bubble">${text}</div></div>`;
      }
      if (item.cls === "v1" || item.cls === "v7") {
        return `<div class="row ${item.cls}">${markHtml(item)}<div class="bubble">${text}</div></div>`;
      }
      return `<div class="row ${item.cls}">${markHtml(item)}<div class="bubble">${text}</div></div>`;
    }

    grid.innerHTML = variants.map((item) => `
      <article class="card" data-id="${item.id}">
        <div class="meta">
          <strong>${item.id}. ${item.name}</strong>
          <span>${item.kind}</span>
        </div>
        <div class="canvas">${mock(item)}</div>
        <div class="copy">${item.kind}。黑白即可，不抢气泡。</div>
        <button class="pick" type="button" data-id="${item.id}">选这个</button>
      </article>
    `).join("");

    function pick(id) {
      current = id;
      document.querySelectorAll(".card").forEach((card) => {
        card.classList.toggle("picked", Number(card.dataset.id) === id);
      });
      const item = variants.find((entry) => entry.id === id);
      chosen.textContent = `已选 ${item.id} · ${item.name}（${item.kind}）。回对话里报这个编号即可。`;
    }
    grid.addEventListener("click", (event) => {
      const id = Number(event.target.closest("[data-id]")?.dataset.id);
      if (id) pick(id);
    });
  </script>
</body>
</html>
