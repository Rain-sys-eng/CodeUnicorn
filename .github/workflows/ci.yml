name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory-kind-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-kind-contract-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-kind-contract-
      - name: Install CMake
        run: command -v cmake >/dev/null 2>&1 || brew install cmake
      - name: Install dependencies
        run: npm ci
      - name: Prepare Tauri test frontend assets
        run: |
          mkdir -p dist/assets
          printf '<!doctype html><html><body></body></html>\n' > dist/index.html
          printf 'ci placeholder\n' > dist/assets/ci-placeholder.txt
      - name: Memory kind contract tests (Rust + TS)
        run: npm run test:memory-kind-contract

  test-tauri:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Install CMake
        run: command -v cmake >/dev/null 2>&1 || brew install cmake
      - name: Install dependencies
        run: npm ci
      - name: Prepare Tauri test frontend assets
        run: |
          mkdir -p dist/assets
          printf '<!doctype html><html><body></body></html>\n' > dist/index.html
          printf 'ci placeholder\n' > dist/assets/ci-placeholder.txt
      - name: Agent Bridge changed-file rustfmt
        run: |
          rustfmt --edition 2021 --check \
            src/agent_orchestration/bridge/commands.rs \
            src/agent_orchestration/bridge/dispatcher.rs \
            src/agent_orchestration/bridge/mcp_gateway.rs \
            src/agent_orchestration/bridge/mcp_gateway_integration_tests.rs \
            src/agent_orchestration/bridge/models.rs \
            src/agent_orchestration/bridge/persistence.rs \
            src/agent_orchestration/bridge/run_registry.rs \
            src/agent_orchestration/bridge/service.rs \
            src/agent_orchestration/bridge/worktree.rs \
            src/command_registry.rs \
            src/state.rs
        working-directory: src-tauri
      - name: Rust tests
        run: cargo test
        working-directory: src-tauri
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Docs governance
        run: npm run check:docs
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Runtime contracts
        run: npm run check:runtime-contracts
      - name: AppShell structure governance
        # T5.6：显式步骤（check:runtime-contracts 已含 governance；保留可读性）
        run: npm run check:app-shell:governance
      - name: Messages boundaries
        run: npm run check:messages-boundaries
      - name: Engine capability matrix
        run: npm run check:engine-capability-matrix
      - name: Context ledger cost budget
        run: npm run check:context-ledger-cost-budget
      - name: Checkpoint policy chain
        run: npm run check:checkpoint-policy-chain
      - name: Governance evidence bridge
        run: npm run check:governance-evidence-bridge
      - name: Agent domain event schema
        run: npm run check:agent-domain-event-schema
      - name: Realtime event batching
        run: npm run check:realtime-event-batching
      - name: Bundle chunking
        run: npm run check:bundle-chunking
      - name: Large-file growth gate
        # 止血 gate：baseline 内文件增长超 growthAllowanceLines(50) 即红。
        # 此前 gate 只挂每周 cron（large-file-governance.yml），主链无拦截。
        run: npm run check:large-files:gate
      - name: Typecheck
        run: npm run typecheck
  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm run test
      - name: Streaming stress gate (100k reasoning chunks)
        run: npm run perf:streaming:stress
  test-windows:
    runs-on: windows-latest
    needs:
      - lint
      - typecheck
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Windows doctor checks
        run: npm run doctor:win
      - name: Integration tests (Windows)
        env:
          VITEST_INCLUDE_HEAVY: "1"
        run: node scripts/test-batched.mjs
  build-macos:
    runs-on: macos-latest
    needs:
      - lint
      - typecheck
      - test-js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
      - name: Install CMake
        run: command -v cmake >/dev/null 2>&1 || brew install cmake
      - name: Install dependencies
        run: npm ci
      - name: Tauri debug build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: npm run tauri -- build --debug --no-bundle
